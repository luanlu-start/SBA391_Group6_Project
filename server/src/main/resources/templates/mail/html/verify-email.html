<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực email đăng ký</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f1f5f9;color:#0f172a;font:16px/1.6 Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e2e8f0;">
    <tr><td><table th:replace="~{html/fragments :: header}"></table></td></tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;">Xác thực email đăng ký</h1>
        <p>Xin chào <strong th:text="${fullName}">Nguyễn Văn An</strong>,</p>
        <p>Mã xác thực đăng ký <span th:text="${appName}">FPTPost</span> của bạn là:</p>
        <p style="margin:24px 0;padding:16px;text-align:center;background:#fff7ed;color:#9a3412;font:700 30px/1.4 monospace;letter-spacing:6px;"
           th:text="${otp}">123456</p>
        <p>Mã có hiệu lực <strong><span th:text="${expirationMinutes}">5</span> phút</strong>.
          Không chia sẻ mã với người khác.</p>
        <p style="color:#64748b;">Nếu bạn không đăng ký tài khoản, hãy bỏ qua email này.</p>
      </td>
    </tr>
    <tr><td><table th:replace="~{html/fragments :: footer}"></table></td></tr>
  </table>
</body>
</html>
