<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${title}">Thông báo</title></head>
<body style="margin:0;padding:24px 12px;background:#f1f5f9;color:#0f172a;font:16px/1.6 Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e2e8f0;">
    <tr><td><table th:replace="~{html/fragments :: header}"></table></td></tr>
    <tr><td style="padding:32px;"><h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;" th:text="${title}">Thông báo</h1>
      <p style="white-space:pre-line;" th:text="${body}">Nội dung thông báo.</p>
      <p>Đăng nhập <span th:text="${appName}">FPTPost</span> để xem thông tin tài khoản và các thông báo của bạn.</p>
    </td></tr>
    <tr><td><table th:replace="~{html/fragments :: footer}"></table></td></tr>
  </table>
</body></html>
