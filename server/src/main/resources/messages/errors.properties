WITHDRAWAL_EXPORT_EMPTY.title=Không có lệnh chi để xuất
WITHDRAWAL_EXPORT_EMPTY.detail=Chưa có yêu cầu rút tiền nào ở trạng thái Đã duyệt để xuất lệnh chi.
WITHDRAWAL_IMPORT_INVALID.title=Tệp kết quả chi không hợp lệ
WITHDRAWAL_IMPORT_INVALID.detail=Tệp CSV cần cột request_code, result (PAID hoặc FAILED), reference khi đã chi và reason khi thất bại; tối đa 500 dòng.
WITHDRAWAL_REFERENCE_DUPLICATED.title=Mã tham chiếu đã được sử dụng
