WITHDRAWAL_STATUS_INVALID.detail=Yêu cầu rút tiền đã được xử lý hoặc chưa đến bước này. Vui lòng tải lại hàng đợi.
WITHDRAWAL_SELF_REVIEW_FORBIDDEN.title=Không được tự xử lý yêu cầu của mình
WITHDRAWAL_SELF_REVIEW_FORBIDDEN.detail=Quản trị viên không được duyệt, từ chối hoặc chi trả yêu cầu rút tiền do chính mình đứng tên.
WITHDRAWAL_SECOND_APPROVER_REQUIRED.title=Cần quản trị viên khác duyệt cấp 2
WITHDRAWAL_SECOND_APPROVER_REQUIRED.detail=Yêu cầu vượt ngưỡng duyệt hai cấp phải do một quản trị viên khác người duyệt cấp 1 xác nhận.
WITHDRAWAL_REVIEW_FILTER_INVALID.title=Bộ lọc hàng đợi rút tiền không hợp lệ
