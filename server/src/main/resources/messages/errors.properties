RECONCILIATION_ITEM_NOT_FOUND.title=Không tìm thấy dòng đối soát
RECONCILIATION_ITEM_NOT_FOUND.detail=Dòng giao dịch đối soát không tồn tại.
RECONCILIATION_ITEM_ALREADY_ADJUSTED.title=Dòng đối soát đã được xử lý
RECONCILIATION_ITEM_ALREADY_ADJUSTED.detail=Dòng giao dịch này đã khớp hoặc đã được tạo bút toán điều chỉnh trước đó.
RECONCILIATION_ADJUSTMENT_INVALID.title=Thông tin bút toán điều chỉnh không hợp lệ
RECONCILIATION_ADJUSTMENT_INVALID.detail=Vui lòng nhập tài khoản ghi Nợ, tài khoản ghi Có khác nhau, số tiền điều chỉnh hợp lệ và lý do điều chỉnh.
