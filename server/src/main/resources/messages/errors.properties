validation.WITHDRAWAL_REFERENCE_INVALID=Mã tham chiếu chỉ gồm chữ, số và các ký tự . _ / -.
BANK_ACCOUNT_NOT_FOUND.title=Không tìm thấy tài khoản ngân hàng
BANK_ACCOUNT_NOT_FOUND.detail=Tài khoản ngân hàng không tồn tại hoặc không thuộc quyền sở hữu của bạn.
