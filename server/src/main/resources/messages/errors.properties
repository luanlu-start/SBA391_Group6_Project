OFFER_EXCEEDED_ROUNDS.detail=Đơn hàng và bưu tá chỉ được thương lượng tối đa 3 vòng cho một chào giá. Vui lòng chấp nhận hoặc từ chối.
OFFER_FORBIDDEN.title=Không có quyền thao tác
OFFER_FORBIDDEN.detail=Bạn không có quyền thực hiện thao tác trên chào giá này.
OFFER_SELF_FORBIDDEN.title=Không thể tự chào giá đơn của mình
OFFER_SELF_FORBIDDEN.detail=Bạn không thể gửi chào giá cho đơn hàng do chính mình tạo.

INVITATION_NOT_FOUND.title=Không tìm thấy lời mời
INVITATION_NOT_FOUND.detail=Lời mời giao hàng không tồn tại hoặc đã bị hủy.
INVITATION_ALREADY_EXISTS.title=Lời mời đã tồn tại
INVITATION_ALREADY_EXISTS.detail=Bạn đã gửi lời mời cho người giao này và lời mời đang chờ phản hồi.
INVITATION_SELF_FORBIDDEN.title=Không thể tự mời chính mình
INVITATION_SELF_FORBIDDEN.detail=Bạn không thể tự gửi lời mời nhận đơn hàng cho chính mình.
INVITATION_NOT_PENDING.title=Lời mời không còn khả dụng
INVITATION_NOT_PENDING.detail=Lời mời này đã được phản hồi hoặc không còn ở trạng thái chờ.
INVITATION_EXPIRED.title=Lời mời đã hết hạn
INVITATION_EXPIRED.detail=Thời hạn phản hồi lời mời giao hàng đã kết thúc.
JOB_NOT_FOUND.title=Không tìm thấy tác vụ
JOB_NOT_FOUND.detail=Tác vụ định kỳ không tồn tại.
