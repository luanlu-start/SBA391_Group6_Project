BANK_ACCOUNT_HOLDER_MISMATCH.title=Tên chủ tài khoản không khớp KYC
BANK_ACCOUNT_HOLDER_MISMATCH.detail=Họ tên chủ tài khoản ngân hàng phải khớp với họ tên trên hồ sơ KYC đã được xác minh của bạn.
BANK_ACCOUNT_DUPLICATED.title=Tài khoản ngân hàng đã tồn tại
BANK_ACCOUNT_DUPLICATED.detail=Số tài khoản ngân hàng này đã được liên kết trong tài khoản của bạn.
BANK_ACCOUNT_COOLDOWN_ACTIVE.title=Tài khoản ngân hàng đang trong thời gian chờ 24 giờ
