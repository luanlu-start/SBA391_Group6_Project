JOB_RUNNING.detail=Tác vụ đang được một instance khác thực hiện. Vui lòng thử lại sau ít phút.
INVITATION_ACCESS_DENIED.title=Không có quyền thao tác
INVITATION_ACCESS_DENIED.detail=Bạn không có quyền thao tác trên lời mời giao hàng này.
