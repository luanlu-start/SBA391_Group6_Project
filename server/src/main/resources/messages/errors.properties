REFUND_NOT_ELIGIBLE.title=Đơn hàng chưa đủ điều kiện hoàn tiền
REFUND_NOT_ELIGIBLE.detail=Chỉ các đơn hàng đã hủy, hết hạn hoặc đã hoàn tiền ký quỹ vào ví mới có thể yêu cầu hoàn tiền về nguồn.
REFUND_SOURCE_NOT_VNPAY.title=Giao dịch gốc không phải VNPay
REFUND_SOURCE_NOT_VNPAY.detail=Đơn hàng này được ký quỹ từ Ví FPTPost nên tiền hoàn đã được cộng trực tiếp vào ví của bạn, không áp dụng hoàn về cổng VNPay.
REFUND_ALREADY_REQUESTED.title=Yêu cầu hoàn tiền đã tồn tại
REFUND_ALREADY_REQUESTED.detail=Đơn hàng này đã có yêu cầu hoàn tiền về nguồn VNPay thành công hoặc đang được xử lý.
REFUND_PROVIDER_REJECTED.title=Cổng VNPay từ chối hoàn tiền
REFUND_PROVIDER_REJECTED.detail=Cổng thanh toán VNPay tạm thời từ chối hoàn về nguồn. Số tiền hoàn vẫn được giữ an toàn trong ví FPTPost và đã báo Admin xử lý.
RECONCILIATION_REPORT_NOT_FOUND.title=Không tìm thấy báo cáo đối soát
