SYS_UNAUTHORIZED.title=Yêu cầu xác thực
SYS_UNAUTHORIZED.detail=Vui lòng đăng nhập để thực hiện thao tác này.
SYS_INVALID_REQUEST.title=Yêu cầu không hợp lệ
SYS_INVALID_REQUEST.detail=Vui lòng kiểm tra dữ liệu và tham số gửi lên.
SYS_FORBIDDEN.title=Không có quyền truy cập
SYS_FORBIDDEN.detail=Bạn không có quyền thực hiện thao tác này.
SYS_RESOURCE_NOT_FOUND.title=Không tìm thấy tài nguyên
SYS_RESOURCE_NOT_FOUND.detail=Tài nguyên không tồn tại hoặc bạn không có quyền truy cập.
SYS_RESOURCE_ALREADY_EXISTS.title=Xung đột dữ liệu
SYS_RESOURCE_ALREADY_EXISTS.detail=Tài nguyên đã tồn tại hoặc dữ liệu đã thay đổi.
SYS_METHOD_NOT_ALLOWED.title=Phương thức không được hỗ trợ
SYS_METHOD_NOT_ALLOWED.detail=Phương thức HTTP không được hỗ trợ tại địa chỉ này.
SYS_NOT_ACCEPTABLE.title=Định dạng phản hồi không được hỗ trợ
SYS_NOT_ACCEPTABLE.detail=Định dạng yêu cầu trong Accept không được hỗ trợ.
SYS_PAYLOAD_TOO_LARGE.title=Dữ liệu quá lớn
SYS_PAYLOAD_TOO_LARGE.detail=Dữ liệu gửi lên vượt giới hạn cho phép.
SYS_UNSUPPORTED_MEDIA_TYPE.title=Định dạng dữ liệu không được hỗ trợ
SYS_UNSUPPORTED_MEDIA_TYPE.detail=Vui lòng gửi dữ liệu với Content-Type phù hợp.
SYS_UPSTREAM_UNAVAILABLE.title=Dịch vụ tạm thời không khả dụng
SYS_UPSTREAM_UNAVAILABLE.detail=Chưa thể kết nối dịch vụ cần thiết. Vui lòng thử lại sau.
SYS_INTERNAL_ERROR.title=Lỗi hệ thống
SYS_INTERNAL_ERROR.detail=Đã xảy ra lỗi hệ thống. Vui lòng thử lại sau hoặc cung cấp mã theo dõi cho bộ phận hỗ trợ.
PRODUCT_NOT_FOUND.title=Không tìm thấy sản phẩm
PRODUCT_NOT_FOUND.detail=Sản phẩm không tồn tại hoặc đã bị xóa.
AUTH_EMAIL_ALREADY_EXISTS.title=Email đã được sử dụng
AUTH_EMAIL_ALREADY_EXISTS.detail=Email đã được sử dụng. Bạn có thể đăng nhập hoặc đặt lại mật khẩu.
AUTH_PHONE_ALREADY_EXISTS.title=Số điện thoại đã được sử dụng
AUTH_PHONE_ALREADY_EXISTS.detail=Số điện thoại đã được sử dụng.
AUTH_PASSWORD_INVALID.title=Mật khẩu không hợp lệ
AUTH_PASSWORD_INVALID.detail=Mật khẩu phải có chữ hoa, chữ thường, chữ số; không trùng email/SĐT và tối đa 72 byte.
AUTH_POLICY_CHANGED.title=Chính sách đã thay đổi
AUTH_POLICY_CHANGED.detail=Chính sách đã thay đổi. Vui lòng tải lại và đọc phiên bản mới.
AUTH_REGISTRATION_BLOCKED.title=Không thể đăng ký
AUTH_REGISTRATION_BLOCKED.detail=Không thể đăng ký với thông tin này.
AUTH_OTP_DELIVERY_FAILED.title=Chưa thể gửi mã xác thực
AUTH_OTP_DELIVERY_FAILED.detail=Chưa thể gửi email xác thực. Vui lòng thử lại sau.
AUTH_REGISTRATION_CONFLICT.title=Thông tin đăng ký bị trùng
AUTH_REGISTRATION_CONFLICT.detail=Thông tin đăng ký đã được sử dụng. Vui lòng kiểm tra lại.
RATE_LIMITED.title=Quá nhiều yêu cầu
RATE_LIMITED.detail=Bạn gửi quá nhiều yêu cầu. Vui lòng thử lại sau một phút.
