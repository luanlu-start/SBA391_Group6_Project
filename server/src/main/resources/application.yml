server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: sba391-group6-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    basename: messages/errors
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${SQLSERVER_URL:jdbc:sqlserver://${COMPUTERNAME}:1433;databaseName=group6_project_db;encrypt=true;trustServerCertificate=true}
    username: ${SQLSERVER_USERNAME:sa}
    password: ${SQLSERVER_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/group6_project_db}
      auto-index-creation: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# SpringDoc OpenAPI / Swagger 3 Configuration
springdoc:
  override-with-generic-response: false
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

# Actuator Health Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Application Custom Properties
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  api-prefix: /api/v1
  mail:
    from: ${MAIL_FROM:no-reply@fptpost.local}
    from-name: ${MAIL_FROM_NAME:FPTPost}
    template-cache: ${MAIL_TEMPLATE_CACHE:false}
  registration:
    password-min-length: 8
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    requests-per-minute: 10
    terms-version: ${TERMS_VERSION:draft-2026-10-09}
    privacy-version: ${PRIVACY_VERSION:draft-2026-10-09}
  authentication:
    jwt-secret: ${JWT_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    expired-session-retention-days: 7
    session-cleanup-cron: "0 0 * * * *"
    max-login-attempts: 5
    login-lock-minutes: 15
    max-devices: 5
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

# VNPay Payment Gateway Configuration
vnpay:
  vnp_TmnCode: ${VNPAY_TMN_CODE:}
  vnp_HashSecret: ${VNPAY_HASH_SECRET:}
  vnp_PayUrl: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  vnp_ReturnUrl: ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
  vnp_ApiUrl: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  version: "2.1.0"
  command: "pay"
  order-type: "other"
  curr-code: "VND"
  locale: "vn"
  timeout-minutes: 15
